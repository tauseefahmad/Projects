name: PDF Reader (Android)

on:
  push:
    paths:
      - "PdfReader/**"
      - ".github/workflows/pdf-reader-android.yml"
  pull_request:
    paths:
      - "PdfReader/**"
  workflow_dispatch:

concurrency:
  group: pdf-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PdfReader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest || (python3 scripts/print_test_failures.py app/build/test-results; exit 1)

      - name: Build debug APK and compile device tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-debug-apk
          path: PdfReader/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: PdfReader/app/build/reports/tests/

  device-tests:
    name: Tests on Android emulator
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: PdfReader
          script: ./gradlew connectedDebugAndroidTest || (python3 scripts/print_test_failures.py app/build/outputs/androidTest-results; exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-report
          path: PdfReader/app/build/reports/androidTests/

  release:
    name: Publish test build
    runs-on: ubuntu-latest
    needs: [build, device-tests]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdf-reader-debug-apk

      - name: Name the APK
        run: mv app-debug.apk "PdfReader-build-${{ github.run_number }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-reader-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PDF Reader build ${{ github.run_number }}
          prerelease: true
          body: |
            Tested build from `${{ github.ref_name }}` (${{ github.sha }}).

            **Change:** ${{ github.event.head_commit.message }}

            Download the APK below and open it on your phone to install or update.
          files: PdfReader-build-${{ github.run_number }}.apk
