name: PDF Reader (Android)

on:
  push:
    paths:
      - "PdfReader/**"
      - ".github/workflows/pdf-reader-android.yml"
  pull_request:
    paths:
      - "PdfReader/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PdfReader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-debug-apk
          path: PdfReader/app/build/outputs/apk/debug/app-debug.apk
