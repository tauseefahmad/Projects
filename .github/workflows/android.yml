name: Android build

on:
  push:
    paths:
      - "job-copilot-android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "job-copilot-android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-copilot-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: job-copilot-debug-apk
          path: job-copilot-android/app/build/outputs/apk/debug/app-debug.apk
